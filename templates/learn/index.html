{% extends 'base.html' %}
{% block title %}📚 自学习平台 · AI 知识点生成{% endblock %}
{% block content %}
<div id="vue-app"></div>
<script>
  window.__PAGE_DATA__ = {
    myRecent: {{ my_recent | tojson }},
    publicHot: {{ public_hot | tojson }},
    kindLabels: {{ KIND_LABELS | tojson }},
    difficultyLabels: {{ DIFFICULTY_LABELS | tojson }},
    isLogged: {% if current_user %}true{% else %}false{% endif %}
  };
</script>
{% endblock %}
{% block vue_script %}
<script src="{{ url_for('static', filename='views/learn_index.js') }}"></script>
{% endblock %}
