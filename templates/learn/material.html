{% extends 'base.html' %}
{% block title %}{{ m.title }} · 学习资料{% endblock %}
{% block content %}
<div id="vue-app"></div>
<script>
  window.__PAGE_DATA__ = {
    m: {{ m | tojson }},
    author: {{ author | tojson }},
    isOwner: {% if is_owner %}true{% else %}false{% endif %},
    conversations: {{ conversations | tojson }},
    isFav: {% if is_fav %}true{% else %}false{% endif %},
    isFollowing: {% if is_following %}true{% else %}false{% endif %},
    myFolders: {{ my_folders | tojson }},
    kindLabels: {{ KIND_LABELS | tojson }},
    difficultyLabels: {{ DIFFICULTY_LABELS | tojson }},
    isLoggedIn: {% if current_user %}true{% else %}false{% endif %}
  };
</script>
{% endblock %}
{% block vue_script %}
<script src="{{ url_for('static', filename='views/learn_material.js') }}"></script>
{% endblock %}
